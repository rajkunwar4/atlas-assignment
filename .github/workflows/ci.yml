name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://atlas:atlas@localhost:55432/atlas_test?sslmode=disable
      DIRECT_URL: postgresql://atlas:atlas@localhost:55432/atlas_test?sslmode=disable
      TEST_DATABASE_URL: postgresql://atlas:atlas@localhost:55432/atlas_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: npm install
      - run: python -m pip install -r apps/api-python/requirements.txt
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  conformance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://atlas:atlas@localhost:55432/atlas_test?sslmode=disable
      DIRECT_URL: postgresql://atlas:atlas@localhost:55432/atlas_test?sslmode=disable
      TEST_DATABASE_URL: postgresql://atlas:atlas@localhost:55432/atlas_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: npm install
      - run: python -m pip install -r apps/api-python/requirements.txt
      - run: npm run migrate
      - run: npm run reset:db
      - run: npm run dev:python &
      - run: npm run dev:node &
      - run: |
          for i in {1..30}; do curl -sf http://localhost:8000/api/health && curl -sf http://localhost:8001/api/health && break; sleep 1; done
      - run: npm run seed:python
      - run: npm run test:conformance
